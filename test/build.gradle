buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.4.0"
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.border.patrol'
    compileSdk 33

    defaultConfig {
        applicationId "com.border.patrol"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
}

repositories {
    google()
    mavenCentral()
}